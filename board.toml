schema_version = 2

[board]
name = "thor"
soc = "SM8475"
soc_source = "sm8475"
os_profile = "ios16.6.1-20G81"
description = "Xiaomi 12S Ultra (thor), Qualcomm SM8475, UEFI Darwin 22 migration"
kit = "thor"

[components]
# These are the only canonical components claimed by the first migration pass.
# ThorUfs/ThorAdreno/ThorMetal remain device-owned staging code until their
# interfaces are published as upstream component repositories.
include = ["ArmDTPlatform", "ArmCpu", "RamBlock", "XnuPrelink", "DarwinBoot", "ThorUfs"]

[ipsw]
url = "https://updates.cdn-apple.com/2023SummerFCS/fullrestores/042-44385/366890C4-D9B5-4938-B399-C19FB58DBEE0/iPad_Pro_HFR_16.6.1_20G81_Restore.ipsw"
product = "iPad7,1"
version = "16.6.1"
build = "20G81"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,AppOS", "Cryptex1,SystemTrustCache", "Cryptex1,SystemOS", "OS"]

[kernel]
defconfig = "thor_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8475.config", "os:configs/ios16.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = ["build-io-storage-family.py", "build-thor-ufs.py"]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# FULLSEQ/DarwinBoot places the selected prelink window at the fixed
# Darwin22 address 0xfffffff00b000000.  The 20G81 cache's original
# __PRELINK_TEXT base is 0xfffffff004fbc000, so this is the exact slide
# required by the Thor loader's in-place Mach-O expansion contract.
slide = "0x6044000"
# Patched copy: apfs is_root_hash_authentication_required (0xfffffff0063ce304)
# returns false so a sealed root mounts unverified; original kept as
# kernelcache.decompressed.orig.
kernelcache_sha256 = "ee88160c66bb5fdfa427159d1f1152ab3cb7388028800b499e6871c066d1fc72"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.kec.Compression",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  # The kernel proper dereferences amfi->... unconditionally (44 sites in
  # ubc_subr.c, pmap.c, kern_trustcache.c), so exec of the first signed binary
  # data-aborted at FAR 0x1a0 with amfi == NULL. AMFI has to be linked in, not
  # merely disabled with amfi_get_out_of_my_way.
  "com.apple.driver.AppleMobileFileIntegrity",
]

[userdata]
# GPT entry "userdata" measured on the phone by the thor UFS driver
# (THOR UFS3/THOR UFS2: first=0x2dfa00 last=0x7683bfa, 4096-byte LBAs).
first_lba = 0x2dfa00
last_lba = 0x7683bfa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[device_tree]
source = "device:dts/thor.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "thor"
dsc = "Platforms/Xiaomi/thorPkg/thor.dsc"
fd = "Build/thorEntry09/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI"]

[firmware.defines]
DEVICE_MODEL = "thor"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "UniXNU-Thor-iOS16"

[payload]
volume = "THOR"
size_mib = 192
loader = "firmware"
title = "UniXNU Thor"
kernel_args = ["-v", "serial=3"]

[payload.adt]
chip_id = "32785"
unique_chip_id = "required"

